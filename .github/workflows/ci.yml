name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip
          coverage: none
          tools: composer

      - name: Unit tests
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer test

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build CSS and vendored front-end assets
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PHP and Nginx images
        run: |
          docker build --target php -f docker/php/Dockerfile -t metin2-website-php:ci .
          docker build --target nginx -f docker/php/Dockerfile -t metin2-website-nginx:ci .
