name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip
          coverage: none
          tools: composer

      - name: Unit tests
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer test

      - name: Package
        run: ./bin/package-release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="dist/metin2-website-${VERSION}.tar.gz"
          CHECKSUM="${TARBALL}.sha256"
          NOTES="Production package ${GITHUB_REF_NAME}. Unpack metin2-website-${VERSION}.tar.gz on the Linux CMS host and run composer install --no-dev. See README.md."
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          ASSETS="$TARBALL"
          if [ -f "$CHECKSUM" ]; then
            ASSETS="$TARBALL $CHECKSUM"
          fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" \
            --title "Metin2 website ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            $PRERELEASE \
            $ASSETS
